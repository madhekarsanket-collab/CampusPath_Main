<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusPath 3D - AIML Building</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #ui-panel {
            position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.95); 
            padding: 20px; border-radius: 8px; z-index: 1; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-family: sans-serif; width: 280px;
        }
        button { background: #0078FF; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; margin-top: 15px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        label { font-size: 0.9rem; font-weight: bold; color: #444; }
    </style>
</head>
<body>
    <div id="ui-panel">
        <h3 style="margin-top:0;">CampusPath Navigator</h3>
        <label>Destination:</label>
        <select style="width:100%; margin: 8px 0 15px 0; padding: 5px;"><option>Room 4309 (AIML)</option></select>
        <label style="display:block; margin-bottom:8px;"><input type="checkbox" checked> Rain-Free Path</label>
        <label style="display:block;"><input type="checkbox"> Avoid Crowds</label>
        <button onclick="alert('Phase 2 Integration Pending: Backend Dijkstra Routing')">Find Path</button>
    </div>
    <div id="map"></div>
    <script>
        mapboxgl.accessToken = 'pk.eyJ1Ijoic2FuNDA0MGciLCJhIjoiY211bjFrY2l0MDV6bTJ6czl3Nzg5ZjU4cyJ9.XVEgOWjAR3DDXyhynLPBng'; // ENSURE TOKEN IS HERE

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/light-v11',
            center: [73.867831, 18.463496], 
            zoom: 18.5,
            pitch: 65,
            bearing: -20,
            antialias: true
        });

        // Final Hardcoded Alignment Values
        const cSx = 1.488;  // Final Scale X
        const cSy = 1.533;  // Final Scale Y
        const cSz = 1.232;  // Final Scale Z
        const cX = 0.00006; // Final Move X
        const cY = 0.00031; // Final Move Y
        const cAlt = 0;
        const cRx = 0.01;
        const cRy = 0; 
        const cRz = 3.14; 
        const baseLng = 73.867831;
        const baseLat = 18.463496;

        const customLayer = {
            id: '3d-model',
            type: 'custom',
            renderingMode: '3d',
            onAdd: function (map, gl) {
                this.camera = new THREE.Camera();
                this.scene = new THREE.Scene();
                const directionalLight = new THREE.DirectionalLight(0xffffff);
                directionalLight.position.set(0, -70, 100).normalize();
                this.scene.add(directionalLight);
                const ambientLight = new THREE.AmbientLight(0x404040, 3);
                this.scene.add(ambientLight);

                const loader = new THREE.GLTFLoader();
                loader.load('assets/AIML_Building4_Standalone.glb', (gltf) => {
                    this.scene.add(gltf.scene);
                });

                this.map = map;
                this.renderer = new THREE.WebGLRenderer({
                    canvas: map.getCanvas(),
                    context: gl,
                    antialias: true
                });
                this.renderer.autoClear = false;
            },
            render: function (gl, matrix) {
                const modelAsMercatorCoordinate = mapboxgl.MercatorCoordinate.fromLngLat([baseLng + cX, baseLat + cY], cAlt);
                const rotationX = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(1, 0, 0), cRx);
                const rotationY = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(0, 1, 0), cRy);
                const rotationZ = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(0, 0, 1), cRz);
                const m = new THREE.Matrix4().fromArray(matrix);
                const l = new THREE.Matrix4()
                    .makeTranslation(modelAsMercatorCoordinate.x, modelAsMercatorCoordinate.y, modelAsMercatorCoordinate.z)
                    .scale(new THREE.Vector3(
                        modelAsMercatorCoordinate.meterInMercatorCoordinateUnits() * cSx,
                        -modelAsMercatorCoordinate.meterInMercatorCoordinateUnits() * cSy,
                        modelAsMercatorCoordinate.meterInMercatorCoordinateUnits() * cSz
                    ))
                    .multiply(rotationX)
                    .multiply(rotationY)
                    .multiply(rotationZ);
                this.camera.projectionMatrix = m.multiply(l);
                this.renderer.resetState();
                this.renderer.render(this.scene, this.camera);
                this.map.triggerRepaint();
            }
        };

        map.on('style.load', () => {
            map.addLayer(customLayer);
        });
    </script>
</body>
</html>
